name: Verify and package
on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.19.0
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk python3-filelock
      - name: Linux tests including native UI
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/verify_all.py --gui --output artifacts/verification
      - name: Native tests
        if: runner.os != 'Linux'
        run: python scripts/verify_all.py --output artifacts/verification
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: python scripts/package.py --deb
      - name: Build native Windows or macOS package
        if: runner.os != 'Linux'
        run: python scripts/package.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: CNCBridge-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
